[package]
name = "aethercore-maintenance-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[target.'cfg(unix)'.dependencies]
# Phase 31 (W7): the unix transport is unconditional — these are no longer optional.
signal-hook = { version = "0.3", default-features = false }
prost.workspace = true

[dependencies]
aethercore-collector-runtime = { path = "../../crates/collector-runtime" }
aethercore-idle-scheduler = { path = "../../crates/idle-scheduler" }
aethercore-update-engine = { path = "../../crates/update-engine" }
aethercore-support-bundle = { path = "../../crates/support-bundle" }
aethercore-cleaner = { path = "../../crates/cleaner" }
aethercore-contracts = { path = "../../crates/contracts" }
aethercore-diagnostics = { path = "../../crates/diagnostics" }
aethercore-diagnostic-engine = { path = "../../crates/diagnostic-engine" }
aethercore-driver-hub = { path = "../../crates/driver-hub" }
aethercore-driver-install = { path = "../../crates/driver-install" }
aethercore-ipc = { path = "../../crates/ipc" }
aethercore-operation-engine = { path = "../../crates/operation-engine" }
aethercore-operation-kernel = { path = "../../crates/operation-kernel" }
aethercore-performance-telemetry = { path = "../../crates/performance-telemetry" }
aethercore-performance-bottleneck = { path = "../../crates/performance-bottleneck" }
aethercore-performance-optimization = { path = "../../crates/performance-optimization" }
aethercore-pc-intelligence = { path = "../../crates/pc-intelligence" }
aethercore-persistence = { path = "../../crates/persistence" }
aethercore-security = { path = "../../crates/security" }
# Phase 32 (T1): read-only security-audit domain (config lint + offline secrets +
# air-gapped CVE join). No network I/O; no system mutations.
aethercore-security-audit = { path = "../../crates/security-audit" }
aethercore-system-repair = { path = "../../crates/system-repair" }
aethercore-startup-manager = { path = "../../crates/startup-manager" }
aethercore-restore-point = { path = "../../crates/restore-point" }
aethercore-timeline-intelligence = { path = "../../crates/timeline-intelligence" }
aethercore-care-orchestrator = { path = "../../crates/care-orchestrator" }
aethercore-intelligence-core = { path = "../../crates/intelligence-core" }
aethercore-platform-capabilities = { path = "../../crates/platform-capabilities" }
sha2.workspace = true
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
uuid.workspace = true
serde_json.workspace = true
# Phase 27 (T1, owner-review waiver): signal_hook provides typed SIGINT/SIGTERM handling
# for the unix --foreground loop — the unix analogue of the Windows SCM Stop control.
# It performs no network I/O. prost provides ServerFrame encoding for the unix session
# writer. Both are optional and activated ONLY by the unix-ipc feature, which also gates
# every unix-composition module in src/, so they compile exclusively for builds that opt in.
signal-hook = { version = "0.3", default-features = false, optional = true }
prost = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-service = "0.8.1"

[dev-dependencies]
# Phase 27: the GD integration test drives real prost-encoded v7 frames over UDS.
prost = { workspace = true }

[features]
default = []
unix-ipc = ["dep:signal-hook", "dep:prost"]
# Phase 27 (T5): audits/tests may force the synthetic engine and the honest "synthetic"
# engine-source label without touching native code paths.
force-synthetic-perf = []
