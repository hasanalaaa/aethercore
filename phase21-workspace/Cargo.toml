[workspace]
members = [
  "apps/desktop",
  "apps/aetherctl",
  "apps/consent-broker",
  "apps/install-hardener",
  "services/maintenance-service",
  "crates/contracts",
  "crates/windows-foundation",
  "crates/collector-runtime",
  "crates/diagnostics",
  "crates/ipc",
  "crates/operation-engine",
  "crates/operation-kernel",
  "crates/persistence",
  "crates/security",
  "crates/gpu-policy",
  "crates/windows-pnp",
  "crates/windows-update",
  "crates/driver-authority",
  "crates/driver-acquisition",
  "crates/driver-hub",
  "crates/restore-point",
  "crates/driver-backup",
  "crates/driver-install",
  "crates/system-repair",
  "crates/windows-repair-intelligence",
  "crates/cleaner",
  "crates/startup-manager",
  "crates/hardware-telemetry",
  "crates/performance-telemetry",
  "crates/performance-bottleneck",
  "crates/performance-optimization",
  "crates/crash-diagnostics",
  "crates/diagnostic-engine",
  "crates/pc-intelligence",
  "crates/timeline-intelligence",
  "crates/care-orchestrator",
  "crates/intelligence-core",
  "crates/platform-capabilities",
  "crates/idle-scheduler",
  "crates/update-engine",
  "crates/update-download",
  "crates/support-bundle",
  "apps/update-broker",
  "tools/update-manifest",
  "tools/support-bundle-verify",
  "tools/ga-probe",
  "crates/db-diagnostics",
  "crates/security-audit",
  "crates/fleet",
]
resolver = "3"

[workspace.package]
license = "Apache-2.0 OR MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
ed25519-dalek = "2"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
prost = "0.14"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Networking_NetworkListManager",
  "Win32_Networking_WinHttp",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_TaskScheduler",
  "Win32_System_EventLog",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Threading",
  "Win32_System_RemoteDesktop",
  "Win32_System_Power",
  "Win32_System_LibraryLoader",
  "Win32_System_Wmi",
  "Win32_System_UpdateAgent",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_Storage_Nvme",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
incremental = false
panic = "abort"
strip = "symbols"
