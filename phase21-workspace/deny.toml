# Phase 31 (W5) — cargo-deny configuration.
# RustSec advisories: deny. Multiple versions: warn (workspace still consolidating).
# Licenses: allowlist compatible with the project's Apache-2.0/MIT/BSD/Unicode family.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Tauri's Linux desktop stack (gtk3-rs family) — upstream unmaintained advisories
    # with no safe upgrade; only reachable on the Linux desktop target, not our primary.
    # Tracked as QD-031-001 (migrate to gtk4-rs when tauri does).
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0370",  # proc-macro-error (tauri/glib build path)
    "RUSTSEC-2025-0075",  # unic-char-range (tauri-utils urlpattern)
    "RUSTSEC-2025-0080",  # unic-common
    "RUSTSEC-2025-0081",  # unic-char-property
    "RUSTSEC-2025-0098",  # unic-ucd-version
    "RUSTSEC-2025-0100",  # unic-ucd-ident
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
skip = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
