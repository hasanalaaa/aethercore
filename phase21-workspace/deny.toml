# Phase 31 (W5) — cargo-deny configuration.
# RustSec advisories: deny. Multiple versions: warn (workspace still consolidating).
# Licenses: allowlist compatible with the project's Apache-2.0/MIT/BSD/Unicode family.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Tauri's Linux desktop stack (gtk3-rs family) — upstream unmaintained advisories
    # with no safe upgrade; only reachable on the Linux desktop target, not our primary.
    # Tracked as QD-031-001 (migrate to gtk4-rs when tauri does).
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0370",  # proc-macro-error (tauri/glib build path)
    "RUSTSEC-2025-0075",  # unic-char-range (tauri-utils urlpattern)
    "RUSTSEC-2025-0080",  # unic-common
    "RUSTSEC-2025-0081",  # unic-char-property
    "RUSTSEC-2025-0098",  # unic-ucd-version
    "RUSTSEC-2025-0100",  # unic-ucd-ident
]

[bans]
multiple-versions = "warn"
# P63 / DBT-P61-001: this was "warn" in a repository whose whole release story is
# a dependency freeze, so the policy the gate has asserted since Phase 8 was simply
# not switched on. Measured before flipping it: zero wildcard requirements in any
# workspace manifest, so this denies a class that does not exist today and keeps it
# that way. `multiple-versions` stays "warn" - the workspace is still consolidating,
# which is the reason recorded at the head of this file.
wildcards = "deny"
# Measured, not assumed: with `wildcards = "deny"` alone, `cargo deny check bans`
# reports every intra-workspace `{ path = "../x" }` as a wildcard - the whole
# internal graph, ~40 manifests. Those are not a supply-chain risk: they resolve
# inside this repository and every workspace member is `publish = false`
# (`Cargo.toml:68`). `allow-wildcard-paths` exempts exactly that case, so what is
# denied is what the policy is about - a wildcard version requirement on a crate
# fetched from a registry.
allow-wildcard-paths = true
skip = []

# P63 / DBT-P61-001: every entry in Cargo.lock resolves to
# `registry+https://github.com/rust-lang/crates.io-index` - zero git sources, zero
# other registries - so this pins the freeze rather than changing what resolves.
# `required-git-spec = "rev"` means that if a git dependency is ever introduced it
# must name an immutable revision, not a branch or tag that can be moved under us.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
