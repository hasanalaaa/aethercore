# shipping crate's `examples/`. It is the evidence that the IPC authorization
# boundary refuses an unprivileged caller — kept runnable, kept out of the payload.
# Third occurrence of the class; see DBT-P36-001 and DBT-P36-008.
[package]
name = "aethercore-p39-probes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "p39_pipe_attack"
path = "src/p39_pipe_attack.rs"

[dependencies]
aethercore-contracts = { path = "../../crates/contracts" }
aethercore-ipc = { path = "../../crates/ipc" }
serde_json.workspace = true
