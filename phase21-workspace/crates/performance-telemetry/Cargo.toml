[package]
name = "aethercore-performance-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aethercore-collector-runtime = { path = "../collector-runtime" }
serde.workspace = true
thiserror.workspace = true
chrono.workspace = true

[target.'cfg(windows)'.dependencies]
aethercore-windows-foundation = { path = "../windows-foundation" }
windows.workspace = true

# Phase 27 (owner-review waiver, audit allowlist): libc is the ONLY new dependency and it is
# strictly cfg-gated to unix targets below. It provides the raw syscall bindings for the
# native macOS/Linux telemetry providers (mach host_statistics64, sysctl, getloadavg,
# statfs, proc_pidinfo; /proc parsing needs no bindings). It performs no network I/O and
# introduces no runtime linkage beyond libSystem/libc which the binary already links.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
uuid.workspace = true
aethercore-performance-bottleneck = { path = "../performance-bottleneck" }
criterion.workspace = true
# DBT-P41-002 (P42 1.A): `capabilities` and the collectors must not contradict
# each other. Asserting that needs both crates in one test process. Dev-only —
# the production dependency direction is unchanged (apps depend on both).
aethercore-platform-capabilities = { path = "../platform-capabilities" }

[[bench]]
name = "perf_ring"
harness = false
