[package]
name = "aethercore-intelligence-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# INVARIANT I5 (air-gapped): the dependency allowlist below is deliberate and audited.
# serde/serde_json — typed evidence + schema parsing; sha2 — model hash pinning;
# thiserror — typed errors. NO network-capable crates (no reqwest/ureq/hyper/tokio
# net features). llama-cpp-2 is a build-time C++ binding with no network stack.

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# WAIVER (audit gate p23-allowlist): llama-cpp-2 is the local inference binding for the
# PERMANENT embedded model (Phase 23.1, owner decision: embedded and enabled by default).
# It performs NO network I/O at runtime; the network-ban gate continues to scan our src.
# Reviewed and approved by the owner in the Phase 23.1 task order.
# DBT-P60-001 / P61. Pinned EXACTLY, and the -sys crate declared here so the pin
# reaches the whole chain. llama-cpp-2 0.1.154's own manifest asks for
# llama-cpp-sys-2 = "0.1.154", a CARET, so pinning the binding alone still lets the
# sys crate float: P60 measured a from-scratch resolution taking llama-cpp-sys-2 to
# 0.1.156, against which llama-cpp-2 0.1.154 fails to compile with 3 errors. A direct
# `=` requirement here is what makes the two intersect to one version. No feature
# change: llama-cpp-sys-2's `default = ["common"]` is already enabled through
# llama-cpp-2's own defaults, so the feature union is identical.
#
# PINNED rather than adopted, and this is the reason. 0.1.156 is not a signature
# change, it is a different engine: 139 files of the vendored llama.cpp differ and 21
# are new (llama-kv-cache-msa.*, an arm64-windows-msvc-cuda toolchain file, ...),
# llama_sampler_init_dry lost an argument, and negative penalty_last_n stopped
# meaning "context size" and is now clamped to 0. DBT-P56-002 is NARROWED on a
# measured generation result, and swapping the inference engine to make a compile
# error go away would retire that measurement without replacing it. The baseline a
# future adoption has to re-measure against, and beat:
# crates/intelligence-core/tests/embedded_generation.rs, 5 of 5 in 42.46 s against the
# shipped .gguf on macOS/Metal, 2026-09-13 -- and it must be measured on Windows,
# which is where this product runs and where nothing has measured generation yet.
llama-cpp-2 = "=0.1.154"
llama-cpp-sys-2 = "=0.1.154"

[dev-dependencies]
tempfile = "3"

[features]
default = ["embedded-model"]
# Phase 23.1: the model ships embedded and ENABLED BY DEFAULT (owner decision).
# `embedded-model` gates only the compile-time binding of the loader; there is no
# user-facing flag and no manual placement step.
embedded-model = []
