syntax = "proto3";
package aethercore.v1;

import "common.proto";

message StartDiagnosticsScanRequest {}

enum ProviderFaultKind {
  PROVIDER_FAULT_KIND_UNSPECIFIED = 0;
  PROVIDER_FAULT_KIND_TIMEOUT = 1;
  PROVIDER_FAULT_KIND_CANCELLED = 2;
  PROVIDER_FAULT_KIND_UNAVAILABLE = 3;
  PROVIDER_FAULT_KIND_PERMISSION_DENIED = 4;
  PROVIDER_FAULT_KIND_MALFORMED_RESPONSE = 5;
  PROVIDER_FAULT_KIND_PROVIDER_FAILURE = 6;
  PROVIDER_FAULT_KIND_IO = 7;
  PROVIDER_FAULT_KIND_INTERNAL = 8;
}
message ProviderFaultInfo {
  string provider = 1;
  string operation = 2;
  string detail = 3;
  string kind = 4;
  ProviderFaultKind kind_code = 5;
}
message GetDiagnosticsSnapshotRequest {}
message GetDiagnosticsHistoryRequest { uint32 limit = 1; }
message AtaSmartAttributeInfo {
  uint32 id = 1;
  uint32 current = 2;
  uint32 worst = 3;
  string raw_value_decimal = 4;
  string raw_value_hex = 5;
}
message StorageReliabilityInfo {
  bool has_temperature = 1; int32 temperature_c = 2;
  bool has_temperature_max = 3; int32 temperature_max_c = 4;
  bool has_wear = 5; uint32 wear_percent_used = 6;
  bool has_power_on_hours = 7; uint64 power_on_hours = 8;
  bool has_read_errors_uncorrected = 9; uint64 read_errors_uncorrected = 10;
  bool has_write_errors_uncorrected = 11; uint64 write_errors_uncorrected = 12;
  bool has_nvme_critical_warning = 13; uint32 nvme_critical_warning = 14;
  bool has_nvme_available_spare = 15; uint32 nvme_available_spare_percent = 16;
  bool has_nvme_percentage_used = 17; uint32 nvme_percentage_used = 18;
  string nvme_media_errors = 19;
  string nvme_unsafe_shutdowns = 20;
  string nvme_error_log_entries = 21;
  bool has_read_latency_max = 22; uint64 read_latency_max_ms = 23;
  bool has_write_latency_max = 24; uint64 write_latency_max_ms = 25;
  bool has_flush_latency_max = 26; uint64 flush_latency_max_ms = 27;
  bool has_nvme_available_spare_threshold = 28; uint32 nvme_available_spare_threshold_percent = 29;
}
// P80-02A (D6). Every reading has an explicit presence flag: an absent one is not zero.
enum MeasurementAvailability {
  MEASUREMENT_AVAILABILITY_UNKNOWN = 0;
  MEASUREMENT_AVAILABILITY_MEASURED = 1;
  MEASUREMENT_AVAILABILITY_NOT_MEASURED = 2;
  MEASUREMENT_AVAILABILITY_UNSUPPORTED = 3;
  MEASUREMENT_AVAILABILITY_DENIED = 4;
  MEASUREMENT_AVAILABILITY_FAILED = 5;
}
message MeasurementCoverageInfo {
  string source = 1;
  bool has_observed_unix_ms = 2; int64 observed_unix_ms = 3;
  bool has_window_days = 4; uint32 window_days = 5;
  MeasurementAvailability availability = 6;
  string reason_key = 7;
}
message ThermalZoneInfo {
  string stable_id = 1;
  string display_name = 2;
  bool has_temperature = 3; int32 temperature_c = 4;
  bool has_critical = 5; int32 critical_c = 6;
  bool has_highest_observed = 7; int32 highest_observed_c = 8;
  MeasurementCoverageInfo coverage = 9;
}
message BatteryInfo {
  string stable_id = 1;
  string display_name = 2;
  bool has_design_capacity = 3; uint64 design_capacity_mwh = 4;
  bool has_full_charge_capacity = 5; uint64 full_charge_capacity_mwh = 6;
  bool has_cycle_count = 7; uint32 cycle_count = 8;
  MeasurementCoverageInfo coverage = 9;
  // Undefined relative units are retained separately; never converted to mWh.
  bool has_design_capacity_relative = 10; uint32 design_capacity_relative = 11;
  bool has_full_charge_capacity_relative = 12; uint32 full_charge_capacity_relative = 13;
}
message BootRecordInfo {
  int64 recorded_unix_ms = 1;
  bool has_duration = 2; uint64 duration_ms = 3;
  MeasurementCoverageInfo coverage = 4;
  bool has_system_boot_instance = 5; uint32 system_boot_instance = 6;
  bool completed_measurement = 7;
  bool has_raw_class = 8; uint32 raw_class_version = 9; uint32 raw_class_value = 10;
  // Captured OS last-restart context; does not infer current physical boot or cold/fast semantics.
  bool matches_os_restart = 11;
  bool has_boot_start = 12; int64 boot_start_unix_ms = 13;
  repeated BootDelayInfo delays = 14;
  bool has_boot_end = 15; int64 boot_end_unix_ms = 16;
  BootComparisonInfo comparison = 17;
  bool delays_truncated = 18;
  bool has_os_restart_observed = 19; int64 os_restart_observed_unix_ms = 20;
}
message BootDelayInfo {
  uint32 event_id = 1; string full_path = 2;
  uint32 total_time_ms = 3; uint32 degradation_time_ms = 4; int64 recorded_unix_ms = 5;
}
message BootComparisonInfo {
  uint64 median_ms = 1; uint32 sample_count = 2;
  int64 window_start_unix_ms = 3; int64 window_end_unix_ms = 4;
  bool has_baseline = 5; uint64 baseline_ms = 6; uint32 baseline_count = 7;
  int64 baseline_window_start_unix_ms = 8; int64 baseline_window_end_unix_ms = 9;
}
message NetworkAdapterInfo {
  string stable_id = 1;
  string display_name = 2;
  bool has_link_speed = 3; uint64 link_speed_bps = 4;
  MeasurementCoverageInfo coverage = 5;
  // P83-02: IF_OPER_STATUS (1 up, 2 down, 3 testing, 4 unknown, 5 dormant, 6 not present, 7 lower layer down).
  bool has_operational_status = 6; uint32 operational_status = 7;
  bool has_connected = 8; bool connected = 9;
  bool has_is_virtual = 10; bool is_virtual = 11;
  bool has_admin_enabled = 12; bool admin_enabled = 13;
  bool has_ipv4_apipa = 14; bool ipv4_apipa = 15;
  bool has_default_route_v4 = 16; bool default_route_v4 = 17;
  bool has_default_route_v6 = 18; bool default_route_v6 = 19;
  NetworkCountersInfo counters = 20;
  NetworkCounterDeltaInfo counter_delta = 21;
  MeasurementAvailability counter_availability = 22;
  MeasurementAvailability route_availability = 23;
}
// Exact decimal u64; the JSON bridge must not round these through JavaScript Number.
message NetworkCountersInfo {
  string in_octets = 1; string out_octets = 2;
  string in_errors = 3; string out_errors = 4;
  string in_discards = 5; string out_discards = 6;
}
message NetworkCounterDeltaInfo {
  string elapsed_ms = 1;
  NetworkCountersInfo counts = 2;
}
message StorageDeviceTelemetryInfo {
  string device_id = 1;
  string friendly_name = 2;
  string firmware_version = 3;
  string serial_number = 4;
  string bus_type = 5;
  string media_type = 6;
  uint64 size_bytes = 7;
  string windows_health_status = 8;
  repeated string operational_status = 9;
  StorageReliabilityInfo reliability = 10;
  string severity = 11;
  string summary = 12;
  repeated string reasons = 13;
  repeated string source_notes = 14;
  repeated AtaSmartAttributeInfo ata_smart_attributes = 15;
}
message MemoryTelemetryInfo {
  uint64 total_physical_bytes = 1;
  uint64 available_physical_bytes = 2;
  uint32 memory_load_percent = 3;
  string pressure_label = 4;
  string pressure_explanation = 5;
}
message HardwareEventInfo {
  uint32 event_id = 1;
  string provider = 2;
  int64 recorded_unix_ms = 3;
  string category = 4;
  string severity = 5;
  string confidence = 6;
  string summary = 7;
  string detail = 8;
}
message CrashRecordInfo {
  string crash_id = 1;
  int64 recorded_unix_ms = 2;
  bool has_bugcheck_code = 3;
  uint32 bugcheck_code = 4;
  string bugcheck_hex = 5;
  repeated string parameters = 6;
  string dump_file = 7;
  uint64 dump_size_bytes = 8;
  string source = 9;
  string confidence = 10;
  string summary = 11;
  // DBT-P46-B6: true when the dump file's mtime was actually read; false
  // means recorded_unix_ms is a fallback (0), not a real timestamp.
  bool has_recorded_unix_ms = 12;
}
message DiagnosticCardInfo {
  string card_id = 1;
  string domain = 2;
  string severity = 3;
  string confidence = 4;
  string title = 5;
  string summary = 6;
  repeated string evidence = 7;
  repeated string actions = 8;
}
message DiagnosticsSnapshot {
  string scan_id = 1;
  string state = 2;
  int64 started_unix_ms = 3;
  int64 completed_unix_ms = 4;
  repeated StorageDeviceTelemetryInfo storage = 5;
  MemoryTelemetryInfo memory = 6;
  repeated HardwareEventInfo events = 7;
  repeated CrashRecordInfo crashes = 8;
  repeated DiagnosticCardInfo cards = 9;
  repeated string warnings = 10;
  uint32 event_window_days = 11;
  DiscoveryState state_code = 12;
  repeated ProviderFaultInfo provider_faults = 13;
  repeated ThermalZoneInfo thermal_zones = 14;
  repeated BatteryInfo batteries = 15;
  repeated BootRecordInfo boots = 16;
  repeated NetworkAdapterInfo network_adapters = 17;
}
// DBT-P46-B4: has_card_count is false only when the stored snapshot JSON for
// this history row could not be parsed (corrupted or schema-incompatible) —
// card_count is then a fallback (0), not a measured card count. true and 0
// together mean a real scan whose snapshot genuinely produced zero cards.
message DiagnosticHistoryEntryInfo { string scan_id = 1; string state = 2; int64 collected_unix_ms = 3; uint32 warning_count = 4; uint32 card_count = 5; bool has_card_count = 6; }
message DiagnosticsSnapshotResponse { DiagnosticsSnapshot snapshot = 1; }
message DiagnosticsHistoryResponse { repeated DiagnosticHistoryEntryInfo entries = 1; }
