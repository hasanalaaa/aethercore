syntax = "proto3";
package aethercore.v1;

// Phase 10 typed protocol primitives. Legacy display strings remain during the v7 migration,
// but authorization/routing/error decisions must use these enums and ErrorInfo.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNSUPPORTED_PROTOCOL = 2;
  ERROR_CODE_DEADLINE_EXCEEDED = 3;
  ERROR_CODE_CANCELLED = 4;
  ERROR_CODE_NOT_FOUND = 5;
  ERROR_CODE_CONFLICT = 6;
  ERROR_CODE_BUSY = 7;
  ERROR_CODE_UNAUTHORIZED = 8;
  ERROR_CODE_FORBIDDEN = 9;
  ERROR_CODE_INTERNAL = 10;
}

message ErrorInfo {
  ErrorCode code = 1;
  string domain = 2;
  string message_key = 3;
  repeated string message_args = 4;
  string correlation_id = 5;
  string technical_detail = 6;
  bool retryable = 7;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_DRAFT = 1;
  OPERATION_STATE_SCANNING = 2;
  OPERATION_STATE_READY_FOR_REVIEW = 3;
  OPERATION_STATE_AWAITING_AUTHORIZATION = 4;
  OPERATION_STATE_PREFLIGHT = 5;
  OPERATION_STATE_PROTECTED = 6;
  OPERATION_STATE_EXECUTING = 7;
  OPERATION_STATE_VERIFYING = 8;
  OPERATION_STATE_COMPLETED = 9;
  OPERATION_STATE_FAILED = 10;
  OPERATION_STATE_REBOOT_PENDING = 11;
  OPERATION_STATE_RESUMING = 12;
}

enum DiscoveryState {
  DISCOVERY_STATE_UNSPECIFIED = 0;
  DISCOVERY_STATE_IDLE = 1;
  DISCOVERY_STATE_SCANNING = 2;
  DISCOVERY_STATE_READY = 3;
  DISCOVERY_STATE_FAILED = 4;
  DISCOVERY_STATE_COLLECTING = 5;
}

enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_GREEN = 1;
  RISK_LEVEL_AMBER = 2;
  RISK_LEVEL_RED = 3;
}

message RequestHeader {
  uint32 protocol_version = 1;
  string request_id = 2;
}
message ResponseHeader {
  uint32 protocol_version = 1;
  string request_id = 2;
}
