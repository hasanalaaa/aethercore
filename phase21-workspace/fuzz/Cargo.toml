[package]
name = "aethercore-db-diagnostics-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# P58: this crate is its own workspace root, which is what `cargo fuzz init`
# generates and what this file has been missing since it was written. Without
# it cargo refuses the manifest outright - "current package believes it's in a
# workspace when it's not" - so `cargo fuzz build` and `cargo fuzz run` have
# never succeeded for ANY target here. fuzz.yml's `continue-on-error: true`
# reported that as success; the workflow was never dispatched, so nobody saw
# either half. Kept out of the parent workspace deliberately: these binaries
# need a nightly toolchain and a sanitizer runtime, and must not be dragged
# into `cargo check --workspace --locked`.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aethercore-db-diagnostics = { path = "../crates/db-diagnostics" }
aethercore-persistence = { path = "../crates/persistence" }
# P76 DBT-P58-004: the crates the other seven targets exercise.
aethercore-ipc = { path = "../crates/ipc" }
aethercore-operation-engine = { path = "../crates/operation-engine" }
aethercore-support-bundle = { path = "../crates/support-bundle", features = ["fuzzing"] }
aethercore-idle-scheduler = { path = "../crates/idle-scheduler" }
aethercore-update-engine = { path = "../crates/update-engine", features = ["fuzzing"] }
aethercore-windows-pnp = { path = "../crates/windows-pnp" }

[[bin]]
name = "export_envelope_parse"
path = "fuzz_targets/export_envelope_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pg_conf_parse"
path = "fuzz_targets/pg_conf_parse.rs"
test = false
doc = false
bench = false

