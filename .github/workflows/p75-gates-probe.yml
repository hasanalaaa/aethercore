name: P75 gates probe
on:
  push:
    branches: [probe/p75-gates]
permissions:
  contents: read
jobs:
  posix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase21-workspace
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: phase29 under the shim, raw output
        run: |
          d=$(mktemp -d)
          python3 -c "import sys; sys.path.insert(0, 'scripts'); import test_gate_readers as t; open(sys.argv[1] + '/sitecustomize.py', 'w').write(t.SHIM)" "$d"
          rc=0; AETHERCORE_UNREADABLE=PHASE_29_BINARY_SAFE_PATCH/MANIFEST.json PYTHONPATH="$d" python3 scripts/phase29-adversarial-audit.py > /tmp/p29.txt 2>&1 || rc=$?
          echo "RESULT: phase29 exit $rc"; grep -n -E 'Traceback|Error|MANIFEST' /tmp/p29.txt | head -20; tail -5 /tmp/p29.txt
      - name: Gate self-tests on ubuntu
        run: |
          python3 --version
          for t in scripts/test_gate_contains.py scripts/test_gate_module_reader.py scripts/test_gate_readers.py scripts/test_omega_delivered_set.py scripts/test_source_seal.py scripts/test_windows_server_support.py scripts/test-phase12-localization.py scripts/ps_marker_scan.py; do
            rc=0; python3 "$t" > /tmp/out.txt 2>&1 || rc=$?; tail -6 /tmp/out.txt; echo "RESULT: $t exit $rc"
          done
  gates:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: phase21-workspace
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gate self-tests, exactly as ci.yml runs them
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python --version
          foreach ($t in @(
            'scripts/test_gate_contains.py'
            'scripts/test_gate_module_reader.py'
            'scripts/test_gate_readers.py'
            'scripts/test_omega_delivered_set.py'
            'scripts/test_source_seal.py'
            'scripts/test_windows_server_support.py'
            'scripts/test-phase12-localization.py'
            'scripts/ps_marker_scan.py'
          )) {
            python $t | Select-Object -Last 3
            Write-Host "RESULT: $t exit $LASTEXITCODE"
          }
      - name: phase10 architecture audit, clean then with a planted definition
        shell: pwsh
        run: |
          & ./scripts/phase10-architecture-audit.ps1 2>&1 | Select-Object -Last 2
          Write-Host "RESULT: clean tree exit $LASTEXITCODE ok=$?"
          Add-Content crates/contracts/proto/aethercore.proto "`nmessage PlantedDefinition {}"
          try { & ./scripts/phase10-architecture-audit.ps1 2>&1 | Select-Object -Last 2; Write-Host "RESULT: planted exit $LASTEXITCODE (no throw)" } catch { Write-Host "RESULT: planted threw: $_" }
