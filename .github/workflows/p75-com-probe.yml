name: P75 COM probe
on:
  push:
    branches: [probe/p75-com]
permissions:
  contents: read
jobs:
  acl:
    runs-on: windows-2025
    steps:
      - name: icacls fixture order
        shell: pwsh
        run: |
          $sid = (whoami /user /fo csv | ConvertFrom-Csv).SID
          Write-Host "user SID $sid"
          function Private($p) {
            icacls $p /inheritance:r | Out-Null; Write-Host "inheritance:r $LASTEXITCODE"
            icacls $p /grant:r "*${sid}:(F)" '*S-1-5-18:(F)' '*S-1-5-32-544:(F)' | Out-Null; Write-Host "grant:r $LASTEXITCODE"
            icacls $p /setowner "*$sid" | Out-Null; Write-Host "setowner $LASTEXITCODE"
          }
          $root = Join-Path $env:TEMP "p75-acl-$(Get-Random)"
          $ssh = Join-Path $root '.ssh'
          New-Item -ItemType Directory $ssh | Out-Null
          Private $ssh
          $key = Join-Path $ssh 'id_ed25519'
          Set-Content $key 'x'
          Write-Host "--- key as created"; icacls $key
          Private $key
          foreach ($p in $ssh, $key) { Write-Host "--- $p"; icacls $p; (Get-Acl $p).Owner }
