name: P75 COM probe
on:
  push:
    branches: [probe/p75-com]
permissions:
  contents: read
jobs:
  xpath:
    runs-on: windows-2025
    steps:
      - name: Event Log XPath, old and new
        shell: pwsh
        run: |
          $w = 30 * 24 * 60 * 60 * 1000
          $old = "*[System[(Provider[@Name='Microsoft-Windows-WHEA-Logger'] or Provider[@Name='Microsoft-Windows-Kernel-Power'] or Provider[@Name='Microsoft-Windows-WER-SystemErrorReporting']) and TimeCreated[timediff(@SystemTime) <= $w]]]"
          $new = "*[System[(Provider[@Name='Microsoft-Windows-WHEA-Logger'] or (Provider[@Name='Microsoft-Windows-Kernel-Power'] and EventID=41) or Provider[@Name='Microsoft-Windows-WER-SystemErrorReporting']) and TimeCreated[timediff(@SystemTime) <= $w]]]"
          foreach ($pair in @(@('old', $old), @('new', $new))) {
            try {
              $e = @(Get-WinEvent -LogName System -FilterXPath $pair[1] -ErrorAction Stop)
              Write-Host "$($pair[0]): VALID, $($e.Count) event(s)"
              $e | Group-Object ProviderName, Id | ForEach-Object { Write-Host "  $($pair[0]) $($_.Name): $($_.Count)" }
            } catch {
              Write-Host "$($pair[0]): $($_.FullyQualifiedErrorId) :: $($_.Exception.Message)"
            }
          }
