name: Windows installer candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'installer-*'

permissions:
  contents: read

jobs:
  build-unsigned-candidate:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: phase21-workspace
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install pinned pnpm
        shell: pwsh
        run: npm install --global pnpm@11.22.0

      # P61: the recipe now lives in .github/actions/install-windows-adk so
      # ci.yml runs the same one. Its comments carry the two corrections that
      # cost a run each to find.
      - uses: ./.github/actions/install-windows-adk

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # P61: shared with ci.yml, which needs the same artifact for
      # crates/intelligence-core/tests/embedded_generation.rs.
      - uses: ./.github/actions/fetch-embedded-model

      - name: Restore UI dependencies
        shell: pwsh
        run: pnpm --dir apps/ui install --frozen-lockfile

      - name: Create candidate dependency evidence
        shell: pwsh
        run: |
          ./scripts/freeze-dependencies.ps1 -Refresh
          # upload-artifact's if-no-files-found only fires when *nothing* matches,
          # so a partial freeze would upload quietly. Assert the whole set here.
          $expected = @(
            'Cargo.lock'
            'pnpm-lock.yaml'
            'release/dependency-locks.sha256'
            'release/dependency-manifests.sha256'
            'release/dependency-freeze.json'
          )
          $absent = @($expected | Where-Object { -not (Test-Path $_) })
          if ($absent) { throw "freeze did not write: $($absent -join ', ')" }
          if (Test-Path 'release/dependency-freeze.blocker.json') { throw 'freeze did not delete the blocker' }

      - name: Build unsigned Windows Setup candidate
        shell: pwsh
        run: ./scripts/build-release.ps1 -UnsignedCandidate -SkipOnlineSupplyChain

      # Everything -Refresh writes. Without this the runner is destroyed with the
      # freeze on it and OMEGA-RB-001 stays open forever. Kept out of the Setup
      # artifact deliberately: this one is reviewed and committed, that one is not.
      #
      # Deliberately AFTER the build. Run 34745535685 uploaded a freeze and then
      # failed to compile the tree that freeze describes (E0061 in
      # crates/intelligence-core/src/llama.rs). A dependency graph that does not
      # build is not evidence of anything, and it must not reach the artifact store
      # where a reviewer could mistake it for a candidate.
      - name: Upload dependency freeze set
        uses: actions/upload-artifact@v4
        with:
          name: dependency-freeze-${{ github.sha }}
          path: |
            phase21-workspace/Cargo.lock
            phase21-workspace/pnpm-lock.yaml
            phase21-workspace/release/dependency-locks.sha256
            phase21-workspace/release/dependency-manifests.sha256
            phase21-workspace/release/dependency-freeze.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Setup candidate
        uses: actions/upload-artifact@v4
        with:
          name: AetherCoreSetup-windows-unsigned-${{ github.sha }}
          path: phase21-workspace/out/release/**/*.exe
          if-no-files-found: error
          retention-days: 14
