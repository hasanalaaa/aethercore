name: CI

# P58: this file lived at `phase21-workspace/.github/workflows/ci.yml` from the
# day it was written until 2026-09-12 and GitHub never saw it. Actions reads
# only `.github/workflows/` at the repository ROOT; anything one directory down
# is an ordinary text file. `DBT-P55-002` - 1,254 formatting violations that
# this file's own `cargo fmt --check` step would have caught on the first push -
# is the direct evidence. `workflow_dispatch` is added so the gate can be run
# deliberately rather than only as a side effect of a push.
on:
  # `push:` was unfiltered. Once this file became a real workflow that meant a
  # ~1h Windows job twice per pull request - once for the branch push, once for
  # the PR - which the four Dependabot PRs opened on 2026-09-12 demonstrated
  # immediately. Branch pushes are covered by `pull_request`.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# P65: there was no concurrency group, so three commits pushed in a row ran three
# ~50-minute Windows jobs in parallel and the first two were already obsolete. The
# group is keyed on the ref, so a new push to a branch cancels that branch's
# in-flight run and nothing else. On `main` this means a run can be cancelled
# before it reaches step 18 -- if a verdict on a specific commit is wanted, use
# `workflow_dispatch` on that SHA, which is what run 34827684392 was.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workspace is not the repository root. Every `run` below is written
# relative to it, as `windows-installer.yml` already does. `uses:` inputs are
# NOT covered by this and carry the prefix explicitly.
defaults:
  run:
    working-directory: phase21-workspace

jobs:
  windows:
    # P76: the job runs on the owner's own Windows PC (a self-hosted runner) only when the
    # repository variable WINDOWS_RUNNER is 'self' - unset it and every run goes back to
    # windows-2025 with no code change - and only for code that is already trusted: a push, or
    # a pull request from a branch of this repository that Dependabot did not open. A fork's
    # pull request, Dependabot's, a manual dispatch and everything else stay on GitHub.
    runs-on: ${{ (vars.WINDOWS_RUNNER == 'self' && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","Windows","X64","aether-win"]') || 'windows-2025' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # P76: on the PC the build tree persists between runs instead of going through
      # actions/cache. It sits beside the runner, OUTSIDE the checkout, so the checkout's clean
      # cannot wipe it and no gate or seal ever sees it.
      - name: Persistent build tree (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $dir = Join-Path (Split-Path (Split-Path $env:RUNNER_WORKSPACE)) 'cache\target'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "CARGO_TARGET_DIR=$dir" | Add-Content -Path $env:GITHUB_ENV
          Write-Host "CARGO_TARGET_DIR=$dir"
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1
      # P76 DBT-P76-009: bootstrap.ps1 is the one script a fresh machine starts under
      # Windows PowerShell 5.1 (it then installs pwsh and re-runs itself there), so 5.1 must
      # be able to parse it.
      - name: bootstrap.ps1 parses under Windows PowerShell 5.1
        if: runner.environment != 'self-hosted'
        shell: powershell
        working-directory: phase21-workspace
        run: |
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/bootstrap.ps1'), [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "PowerShell $($PSVersionTable.PSVersion) parses bootstrap.ps1"
      # P76: the same check, for the owner's PC. Windows PowerShell's execution policy there is
      # Restricted, and `shell: powershell` runs a step as a temporary .ps1 file, which that
      # policy refuses. Parsing needs no file: the identical script is handed to powershell.exe
      # as an encoded command from a pwsh step.
      - name: bootstrap.ps1 parses under Windows PowerShell 5.1 (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: pwsh
        working-directory: phase21-workspace
        run: |
          $check = @'
          $ProgressPreference = 'SilentlyContinue'
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/bootstrap.ps1'), [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host ('PowerShell ' + $PSVersionTable.PSVersion + ' parses bootstrap.ps1')
          '@
          powershell -NoProfile -NonInteractive -Command $check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      # P76: a no-op where that exact version is already installed (the owner's PC), so the job
      # never rewrites a global npm prefix that is not the runner's own.
      - name: Install pinned pnpm
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          if ((Get-Command pnpm -ErrorAction SilentlyContinue) -and ((pnpm --version) -eq '11.22.0')) {
            Write-Host 'pnpm 11.22.0 is already installed'
          } else {
            npm install --global pnpm@11.22.0
            if ($LASTEXITCODE -ne 0) { throw 'pnpm install failed' }
          }
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      # P65: the ADK action already short-circuits on `Test-Path $lib`, so restoring
      # the Deployment Tools directory skips the download entirely. Measured cost of
      # the install on run 34827684392: 38s -- the smallest of the three caches added
      # here, and kept because it is also the one network fetch in the first twelve
      # steps. The action still verifies by enumeration afterwards, so a partial
      # restore fails loudly rather than silently linking against nothing.
      #
      # Split restore/save, and the first version of this was NOT and was wrong.
      # `actions/cache@v4` saves from a post-step declared `post-if: success()`, so
      # on a job that fails -- which this one has, every run since P59 -- it never
      # saves at all. Measured: run 34831042672 wrote the key, run 34834327695 asked
      # for the same unchanged key and got "Cache not found", and the ADK install ran
      # for 55s again. The save sits immediately after the install instead, with no
      # `always()`: a plain step is skipped when an earlier step failed, so a failed
      # install cannot publish a half-populated Deployment Tools directory, while a
      # failure later in the job cannot prevent a save that has already happened.
      - name: Restore Windows ADK Deployment Tools
        id: adk-cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@v6
        with:
          path: C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools
          key: ${{ runner.os }}-adk-deploytools-${{ hashFiles('.github/actions/install-windows-adk/action.yml') }}
      # DBT-P60-006: this job has never installed the ADK, so
      # crates/system-repair/build.rs could not find dismapi.lib and every step
      # from `cargo test` onward was unreachable. The recipe is shared with
      # windows-installer.yml rather than copied - see the action's own header.
      - uses: ./.github/actions/install-windows-adk
      - name: Save Windows ADK Deployment Tools
        if: runner.environment != 'self-hosted' && steps.adk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools
          key: ${{ steps.adk-cache.outputs.cache-primary-key }}
      # P61: the seal P60 built and proved can fail had no automated caller —
      # `p30-delivered-source-seal-ok` lives in phase30-adversarial-audit.py and
      # the phase30<-31<-32<-33<-34 chain terminates unreferenced. It runs here,
      # first, because everything after it trusts these bytes. It is also the
      # only place `.gitattributes`'s eol rules get checked on Windows: the seal
      # hashes the WORKING TREE, so a checkout that rewrote line endings fails it.
      - name: Delivered source seal
        run: python scripts/source_seal.py
      - name: Verify approved dependency freeze
        shell: pwsh
        run: ./scripts/freeze-dependencies.ps1 -VerifyOnly
      - name: Frozen dependency restore
        run: pnpm --dir apps/ui install --frozen-lockfile
      # P65: this job had no cache of any kind -- `package-manager-cache: false` was
      # the only cache line in the file -- so every run downloaded the registry and
      # rebuilt 135 binaries from scratch. `restore`/`save` are split rather than
      # using `actions/cache` directly for one reason that matters here: this job has
      # failed at step 18 or later in every run since P59, and a plain `cache` step
      # saves in a post-step that a failed job skips. Split, with `if: always()` on
      # the save, the tree built by a run that later goes red is still kept.
      # pnpm is deliberately NOT cached: `pnpm install --frozen-lockfile` measured 3s
      # on run 34827684392, which is less than a cache round-trip would cost.
      - name: Restore Rust build cache
        id: cargo-cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            phase21-workspace/target
          key: ${{ runner.os }}-cargo-1.97.1-${{ hashFiles('phase21-workspace/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.97.1-
      - name: Rust formatting
        run: cargo fmt --all -- --check
      # crates/intelligence-core/tests/embedded_generation.rs runs against the
      # REAL shipped .gguf - a mock cannot prove llama.cpp is linked or that a
      # token comes out - and asserts its absence loudly rather than skipping.
      # The artifact is gitignored, so the job has to fetch it.
      - uses: ./.github/actions/fetch-embedded-model
      - name: Rust unit/integration tests
        run: cargo test --locked --workspace
      - name: UI accessibility/type gate
        run: pnpm --dir apps/ui check
      # P75 ui-truth: pure UI logic (keyboard shortcuts, Fleet run outcomes) under node's own
      # test runner; no test dependency. Files are listed, not globbed: a missing file fails.
      - name: UI unit tests
        run: node --experimental-strip-types --import ./apps/ui/tests/resolve-ts.mjs --test apps/ui/tests/navigation.test.ts apps/ui/tests/fleet.test.ts apps/ui/tests/care.test.ts apps/ui/tests/wire-values.test.ts apps/ui/tests/timeline-text.test.ts apps/ui/tests/localized-text.test.ts apps/ui/tests/repair-progress.test.ts
      - name: UI production build
        run: pnpm --dir apps/ui build
      - name: Locked Rust workspace check
        run: cargo check --workspace --locked
      # P75 review (#36): the build without the embedded model (the feature-off fallback)
      # stopped compiling and nothing noticed. A new check, not a relaxed one.
      - name: Intelligence core builds without the embedded model
        run: cargo check -p aethercore-intelligence-core --no-default-features --locked
      - name: Platform-neutral invariants
        run: python scripts/static_validate.py
      - name: Enterprise convergence master source/native qualification gate
        shell: pwsh
        run: ./scripts/verify-enterprise.ps1 -SkipOnlineSupplyChain
      - name: Zenith adversarial source interaction and accessibility gate
        shell: pwsh
        run: ./scripts/zenith-adversarial-audit.ps1
      - name: Zenith recursive architecture and resource-safety gate
        shell: pwsh
        run: ./scripts/zenith-recursive-audit.ps1
      - name: Supply-chain audit
        shell: pwsh
        run: ./scripts/audit-dependencies.ps1
      - name: Build unsigned production packaging candidate
        shell: pwsh
        run: ./scripts/build-release.ps1 -SkipOnlineSupplyChain
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: aethercore-enterprise-converged-unsigned-candidate
          path: phase21-workspace/out/release/**
          if-no-files-found: error
          retention-days: 14
      # Last, and `always()`, so a run that dies at step 18 still leaves the build
      # tree behind for the next one. Skipped on an exact key hit -- there is
      # nothing new to store when Cargo.lock has not moved.
      - name: Save Rust build cache
        if: always() && runner.environment != 'self-hosted' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            phase21-workspace/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # P75 gate-honesty: the gates' own tests and the PowerShell assertion scanner had no CI
  # caller, so a broken gate reader or a failing marker was found only by hand. macOS, not
  # Windows or Linux, measured on throwaway runs: test_gate_readers.py injects unreadable
  # sources with POSIX semantics that do not hold on Windows (36240659611), and the phase29
  # chain it exercises shells out to plutil, which Linux lacks (36240919751). All eight pass
  # on macos-latest (36240971179).
  gate-self-tests:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: phase21-workspace
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gate self-tests
        run: |
          for t in scripts/test_gate_contains.py scripts/test_gate_module_reader.py \
                   scripts/test_gate_readers.py scripts/test_omega_delivered_set.py \
                   scripts/test_source_seal.py scripts/test_windows_server_support.py \
                   scripts/test-phase12-localization.py scripts/ps_marker_scan.py \
                   scripts/test_bootstrap_pwsh.py; do
            echo "== $t"
            python3 "$t"
          done

  # P76 DBT-P75-001: the Linux telemetry provider is compiled only for Linux, so the
  # Windows job's clippy never read it and five findings sat in it. One crate, not the
  # workspace: the desktop app needs WebKitGTK to build here, and that is not this gate.
  linux-provider-clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase21-workspace
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup override set 1.97.1
      - name: Linux telemetry provider clippy
        run: cargo clippy -p aethercore-performance-telemetry --lib --locked -- -D warnings

  deny-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources
